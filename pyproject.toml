[project]
name = "sheetrender"
version = "0.1.0"
description = "Spreadsheet + HTML template in, a PDF per row out. The batch rendering engine behind sheetrender.com."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "SheetRender", email = "info@finaldynamics.com" }]
keywords = [
  "pdf",
  "html-to-pdf",
  "mail-merge",
  "csv",
  "xlsx",
  "spreadsheet",
  "invoice",
  "batch",
  "playwright",
  "jinja2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Printing",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Office/Business",
]
dependencies = [
  "playwright>=1.44",
  "jinja2>=3.1",
  "nh3>=0.3",
  "pikepdf>=10",
  "pypdf>=6",
  "pypdfium2>=5",
  "pillow>=11",
  "openpyxl>=3.1",
]

[project.scripts]
sheetrender = "sheetrender.cli:main"

[project.urls]
Homepage = "https://sheetrender.com"
Source = "https://github.com/sheetrender/sheetrender"
Issues = "https://github.com/sheetrender/sheetrender/issues"
Changelog = "https://github.com/sheetrender/sheetrender/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # Pinned exact: CI runs `ruff check`, and a floating linter turns unrelated
  # PRs red when a new ruff release adds rules.
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Explicit selection so the rule set cannot move underneath CI. Pycodestyle
# errors, pyflakes, and import order; the engine's deliberate broad-except
# robustness patterns are out of scope.
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetrender"]
